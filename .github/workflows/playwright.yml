name: Frontend CI
# Production hardening R5: every push and PR gets type-check, unit tests, a production build guarded against demo
# settings, and the Playwright suites that do not need a live backend. Specs tagged @backend need a running API with
# seeded accounts; they run in the full-stack job described in docs/production/CI-CD-STRATEGY.md.
on:
  push:
    branches: [ main, master, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Type check
      run: npm run lint
    - name: Unit tests
      run: npm test
    - name: Production environment guard
      run: node scripts/check-prod-env.mjs
      env:
        GP_TARGET: production
        NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid/api/v1
    - name: Production build
      run: npm run build
      env:
        NEXT_PUBLIC_USE_MOCK_API: 'false'
        NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid/api/v1

  e2e:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: quality
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium
    - name: Run Playwright tests (no backend required)
      run: npx playwright test --grep-invert "@backend"
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 14
