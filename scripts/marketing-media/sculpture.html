<!doctype html>
<!--
  GrowthPrint signature sculpture: an original ray-marched 3D render (two intertwined metal strands around a ring,
  iridescent violet / blue / cyan / magenta reflections, one floating sphere). Rendered offline by
  render-media.mjs into a transparent image; the website ships the image, not this shader.
  Query parameters: ?size=1400&angle=0 (angle in radians turns the sculpture, used for the video).
-->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes; uniform float uAngle;
#define PI 3.14159265

mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }
float smin(float a,float b,float k){ float h=clamp(.5+.5*(b-a)/k,0.,1.); return mix(b,a,h)-k*h*(1.-h); }

vec3 toObject(vec3 p){
  p.xz *= rot(uAngle);
  p.yz *= rot(0.95);
  p.xy *= rot(-0.55);
  return p;
}

float sculpture(vec3 p){
  p = toObject(p);
  float a = atan(p.z, p.x);
  // breathing ring: the major radius and the tube swell along the loop so it reads as poured, not machined
  float R = 1.05 + 0.08*sin(2.0*a + 0.6);
  vec2 q = vec2(length(p.xz) - R, p.y + 0.10*sin(a*2.0));
  q *= rot(a*1.0 + 0.4);
  float r2 = 0.235 + 0.07*sin(3.0*a + 1.1);
  float s1 = length(q - vec2(0.33, 0.0)) - r2;
  float s2 = length(q + vec2(0.33, 0.0)) - (r2*0.86);
  return smin(s1, s2, 0.10);
}

float orb(vec3 p){ return length(p - vec3(0.62, 1.42, 0.55)) - 0.135; }

float map(vec3 p, out float id){
  float a = sculpture(p), b = orb(p);
  id = a < b ? 0.0 : 1.0;
  return min(a, b);
}
float mapD(vec3 p){ float id; return map(p, id); }

vec3 normalAt(vec3 p){
  vec2 e = vec2(0.0012, 0.0);
  return normalize(vec3(mapD(p+e.xyy)-mapD(p-e.xyy), mapD(p+e.yxy)-mapD(p-e.yxy), mapD(p+e.yyx)-mapD(p-e.yyx)));
}

// Studio environment: dark violet room, a large white softbox, a cyan rim light and a magenta kicker.
vec3 env(vec3 d){
  float t = d.y*0.5 + 0.5;
  vec3 c = mix(vec3(0.030,0.015,0.070), vec3(0.40,0.30,0.88), smoothstep(0.10, 0.95, t));
  c += vec3(0.95,0.96,1.0) * pow(max(dot(d, normalize(vec3(-0.45,0.85,0.55))),0.0), 12.0) * 4.2;
  c += vec3(0.90,0.92,1.0) * pow(max(dot(d, normalize(vec3(0.65,0.55,0.55))),0.0), 18.0) * 2.4;
  c += vec3(0.70,0.78,1.0) * pow(max(dot(d, normalize(vec3(0.2,0.9,-0.4))),0.0), 6.0) * 0.55;
  c += vec3(0.10,0.85,1.00) * pow(max(dot(d, normalize(vec3(0.95,0.05,0.35))),0.0), 7.0) * 1.25;
  c += vec3(1.00,0.25,0.80) * pow(max(dot(d, normalize(vec3(-0.55,-0.55,0.65))),0.0), 5.0) * 1.05;
  c += vec3(0.30,0.20,1.00) * pow(max(dot(d, normalize(vec3(0.1,-0.9,0.3))),0.0), 3.0) * 0.45;
  return c;
}

vec3 iridescence(float f){
  return 0.5 + 0.5*cos(2.0*PI*(vec3(0.62,0.70,0.82) + f*vec3(0.85,0.72,0.60)));
}

float ao(vec3 p, vec3 n){
  float o = 0.0, s = 1.0;
  for(int i=1;i<=5;i++){ float h = 0.03*float(i); o += (h - mapD(p+n*h))*s; s *= 0.7; }
  return clamp(1.0 - 2.2*o, 0.0, 1.0);
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uRes) / uRes.y;
  vec3 ro = vec3(0.0, 0.10, 6.3);
  vec3 rd = normalize(vec3(uv*0.95, -1.6));
  float t = 0.0, id = 0.0; bool hit = false;
  for(int i=0;i<220;i++){
    vec3 p = ro + rd*t;
    float d = map(p, id);
    if(d < 0.0006){ hit = true; break; }
    t += d*0.6;
    if(t > 9.0) break;
  }
  if(!hit){ gl_FragColor = vec4(0.0); return; }
  vec3 p = ro + rd*t, n = normalAt(p), v = -rd, r = reflect(rd, n);
  float ndv = clamp(dot(n, v), 0.0, 1.0);
  float fres = pow(1.0 - ndv, 4.0);
  vec3 tint = id < 0.5 ? mix(vec3(0.90,0.90,1.0), iridescence(ndv + 0.15*n.y), 0.45) : mix(vec3(0.55,0.52,0.95), iridescence(ndv), 0.4);
  vec3 col = env(r) * tint;
  col += env(r) * fres * 0.9;
  col += vec3(0.09,0.06,0.18);                       // a little body colour so shadows stay violet, not black
  col *= mix(0.55, 1.0, ao(p, n));
  col = col / (1.0 + col*0.55);                     // soft tone map
  col = pow(col, vec3(0.88));
  gl_FragColor = vec4(col, 1.0);
}
</script>
<script>
const params = new URLSearchParams(location.search);
const size = Number(params.get('size') || 1200), angle = Number(params.get('angle') || 0);
const c = document.getElementById('c'); c.width = size; c.height = size; c.style.width = size + 'px'; c.style.height = size + 'px';
const gl = c.getContext('webgl', { alpha: true, premultipliedAlpha: false, preserveDrawingBuffer: true, antialias: true });
const vs = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
gl.linkProgram(pr); gl.useProgram(pr);
const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
gl.uniform2f(gl.getUniformLocation(pr, 'uRes'), size, size);
gl.uniform1f(gl.getUniformLocation(pr, 'uAngle'), angle);
gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); gl.finish();
window.__done = true;
</script></body></html>
